<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register | UrbanTrends</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>


  <header class="header">
    <div class="header-left">
      <button id="menu-btn" class="icon-btn" aria-label="Open menu">&#9776;</button>
      <div class="logo-box">UT</div>
      <h1 class="brand"><a href="index.html">UrbanTrends</a></h1>
    </div>
    <div class="header-right">
      <a href="login.html" class="icon-btn" aria-label="Profile">&#128100;</a>
      <button class="icon-btn cart-btn" aria-label="Cart">
        &#128722;
        <span id="cart-count" class="badge">0</span>
      </button>
    </div>
  </header>


  <nav id="sidebar" class="sidebar">
    <button id="close-btn" class="close-btn">&times;</button>
    <a href="index.html">Home</a>
    <a href="index.html#new-arrivals">New Arrivals</a>
    <a href="index.html#best-sellers">Best Sellers</a>
    <a href="index.html#streetwear">Streetwear</a>
    <a href="index.html#basics">Basics</a>
    <a href="index.html#sale">Sale Items</a>
  </nav>
  <div id="overlay" class="overlay"></div>

  <main>

    <section class="auth-section">
      <div class="auth-card">


        <div class="auth-tabs">
          <button class="auth-tab active" data-target="login-form">Login</button>
          <button class="auth-tab" data-target="register-form">Register</button>
        </div>


        <form id="login-form" class="auth-form active" novalidate>
          <h2>Welcome back</h2>
          <p class="auth-sub">Log in to see your saved items and orders.</p>

          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="you@email.com">
            <small class="error"></small>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Enter your password">
            <small class="error"></small>
          </div>

          <label class="check-row">
            <input type="checkbox" class="show-pass" data-target="login-password"> Show password
          </label>

          <button type="submit" class="auth-btn">Log In</button>

          <p class="switch-text">
            No account yet?
            <button type="button" class="switch-link" data-target="register-form">Register here</button>
          </p>
        </form>


        <form id="register-form" class="auth-form" novalidate>
          <h2>Create an account</h2>
          <p class="auth-sub">Join UrbanThread and get member-only deals.</p>

          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" placeholder="Juan Dela Cruz">
            <small class="error"></small>
          </div>

          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="you@email.com">
            <small class="error"></small>
          </div>

          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="At least 6 characters">
            <small class="error"></small>
          </div>

          <div class="form-group">
            <label for="reg-confirm">Confirm Password</label>
            <input type="password" id="reg-confirm" placeholder="Type it again">
            <small class="error"></small>
          </div>

          <label class="check-row">
            <input type="checkbox" class="show-pass" data-target="reg-password"> Show password
          </label>

          <div class="form-group">
            <label class="check-row">
              <input type="checkbox" id="reg-terms"> I agree to the Terms &amp; Conditions
            </label>
            <small class="error"></small>
          </div>

          <button type="submit" class="auth-btn">Create Account</button>

          <p class="switch-text">
            Already have an account?
            <button type="button" class="switch-link" data-target="login-form">Log in</button>
          </p>
        </form>

      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 UrbanThread. Student project.</p>
  </footer>


  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
